<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Ustensiles</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-gray-100">
    <nav class="bg-white p-4 rounded shadow-md mb-6">
        <div class="max-w-6xl mx-auto">
          <div class="flex justify-between">
            <div class="flex space-x-8">
              <a href="/scenarios" class="text-xl font-bold text-gray-700 hover:text-blue-500">Liste des scénarios</a>
              <a href="/menus" class="text-xl font-bold text-gray-700 hover:text-blue-500">Liste des menus</a>
            </div>
            <a href="/help" class="text-xl font-bold text-gray-700 hover:text-blue-500">Aide</a>
          </div>
        </div>
      </nav>
    <div class="flex h-screen">
        <div class="w-1/5 bg-white shadow-md p-4 overflow-y-auto icon-container p-4 border rounded bg-gray-100">
            <h2 class="text-lg font-semibold mb-4">Liste des ustensiles</h2>
            <div class="grid grid-cols-3 gap-4 font-sans" id="iconContainer">
            </div>

        </div>

        <div class="flex-grow relative flex items-center justify-center">
            <canvas id="tableCanvas" width="1000" height="600" class="border rounded shadow-lg"></canvas>

            <div id="controlPanel" class="absolute top-4 right-4 bg-white p-4 shadow-lg rounded-md hidden">
                <h3 class="text-lg font-semibold mb-2">Configuration</h3>
                <h5 id="controlPanelCutleryName" class="text-lg mb-2">Configuration</h5>
                <p id="objectNameDisplay" class="text-sm font-medium text-gray-700 mb-2"></p>
                <div class="mb-2">
                    <label for="posX" class="block text-sm font-medium">Position X :</label>
                    <input type="number" id="posX" step="1" class="w-full border rounded px-2 py-1">
                </div>
                <div class="mb-2">
                    <label for="posY" class="block text-sm font-medium">Position Y :</label>
                    <input type="number" id="posY" step="1" class="w-full border rounded px-2 py-1">
                </div>
                <div class="mb-2">
                    <label for="rotation" class="block text-sm font-medium">Rotation :</label>
                    <input type="number" id="rotation" step="1" class="w-full border rounded px-2 py-1">
                </div>
                <div class="mb-2">
                    <label for="placementOrder" class="block text-sm font-medium">Ordre de placement :</label>
                    <input type="number" id="placementOrder" step="1" class="w-full border rounded px-2 py-1">
                </div>
                <!-- <div class="mb-2">
                    <label for="parentSelect" class="block text-sm font-medium">Parent :</label>
                    <select id="parentSelect" class="w-full border rounded px-2 py-1">
                        <option value="table">Table</option>
                    </select>
                </div> -->
                <!-- <button id="applyChanges" class="mt-2 w-full  text-white rounded py-2">Appliquer</button> -->
                <button id="deleteObject" class="mt-2 w-full  text-white rounded py-2">Supprimer</button>
            </div>
            

            <div id="centerSelectionPanel" class="absolute bottom-16 left-4 bg-white p-6 shadow-lg rounded-md hidden">
                <button id="centerSelection" class="w-full text-white rounded p-2">Centrer la Sélection</button>
            </div>
        </div>
        <div class="menu p-4 border rounded bg-gray-100 w-1/5">
        <label class="block text-gray-700">Nom du menu :</label>
        <input type="text" class="menu-name w-full px-3 py-2 border rounded mb-2" required placeholder="Le nom du menu">
        <label class="block text-gray-700">Description :</label>
        <input type="text" class="menu-description w-full px-3 py-2 border rounded mb-2" required placeholder="La description du menu">
        <label class="block text-gray-700">Entrée :</label>
        <input type="text" class="menu-appetizer w-full px-3 py-2 border rounded mb-2" required placeholder="L'entrée du menu">
        <label class="block text-gray-700">Plat :</label>
        <input type="text" class="menu-main-course w-full px-3 py-2 border rounded mb-2" required placeholder="Le plat principal du menu">
        <label class="block text-gray-700">Dessert :</label>
        <input type="text" class="menu-dessert w-full px-3 py-2 border rounded mb-2" required placeholder="Le dessert du menu">
        <div class="mt-6">
            <button id="save-menu" class="w-full text-white rounded py-2 mb-2">Sauvegarder le menu</button>
        </div>
    </div>
</div>
<script type="module" src="/js/menuUpdater.js" defer></script>
</body>

</html>
